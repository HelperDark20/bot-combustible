<!DOCTYPE html>
<html lang="es">
<head>
  {% include "_head.html" %}
  <link rel="stylesheet" href="/static/css/historial.css">
</head>
<body>

  <div class="header">
    <p class="header-sub" id="header-sub">Cargando...</p>
    <p class="header-title">Historial</p>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="cambiarTab('todos', this)">Todos</button>
    <button class="tab" onclick="cambiarTab('hoy', this)">Hoy</button>
    <button class="tab" onclick="cambiarTab('semana', this)">Semana</button>
    <button class="tab" onclick="cambiarTab('mes', this)">Mes</button>
  </div>

  <div class="content" id="content">
    <div class="skeleton skeleton-item" style="margin-bottom:8px;"></div>
    <div class="skeleton skeleton-item" style="margin-bottom:8px;"></div>
    <div class="skeleton skeleton-item" style="margin-bottom:8px;"></div>
    <div class="skeleton skeleton-item"></div>
  </div>

  <!-- SHEET DETALLE -->
  <div class="overlay" id="overlay" onclick="cerrarDetalle(event)">
    <div class="sheet" id="sheet">
      <div class="sheet-handle"><div class="sheet-handle-bar"></div></div>
      <div class="sheet-inner" id="sheet-inner"></div>
    </div>
  </div>

  {% include "_nav.html" %}

  <script src="/static/js/core.js"></script>
  <script src="/static/js/historial.js"></script>

</body>
</html>
