<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>IA Viajes — Historial</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --green: #00ff73; --green-dim: rgba(0,255,115,0.12); --green-border: rgba(0,255,115,0.25);
      --red: #ff4444; --red-dim: rgba(255,60,60,0.12); --red-border: rgba(255,60,60,0.25);
      --yellow: #ffb400; --yellow-dim: rgba(255,180,0,0.1); --yellow-border: rgba(255,180,0,0.25);
      --gray-dim: rgba(150,150,150,0.1); --gray-border: rgba(150,150,150,0.2);
      --orange-dim: rgba(255,140,0,0.08); --orange-border: rgba(255,140,0,0.25);
      --bg: #0a0a0a; --card: rgba(255,255,255,0.04); --border: rgba(255,255,255,0.07);
      --text: white; --text-dim: rgba(255,255,255,0.4);
    }
    html, body { background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif; min-height: 100vh; }
    .header { padding: 52px 20px 16px; }
    .header-sub { font-size: 12px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
    .header-title { font-size: 22px; font-weight: 800; color: var(--text); }
    .tabs { padding: 0 16px 16px; display: flex; gap: 8px; }
    .tab { flex: 1; padding: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; font-size: 12px; font-weight: 700; color: var(--text-dim); cursor: pointer; font-family: 'Space Grotesk', sans-serif; text-align: center; transition: all 0.15s; }
    .tab.active { background: var(--green); border-color: var(--green); color: #000; }
    .content { padding: 0 16px 100px; display: flex; flex-direction: column; gap: 8px; }
    .fecha-label { font-size: 11px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 0 4px; }
    .viaje-item { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; transition: background 0.15s; }
    .viaje-item:active { background: rgba(255,255,255,0.07); }
    .viaje-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .viaje-icon { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .icon-completado { background: var(--green-dim); border: 1.5px solid var(--green-border); }
    .icon-completado i { color: var(--green); font-size: 16px; }
    .icon-rechazado { background: var(--gray-dim); border: 1.5px solid var(--gray-border); }
    .icon-rechazado i { color: rgba(255,255,255,0.35); font-size: 16px; }
    .icon-cancelado_usuario { background: var(--orange-dim); border: 1.5px solid var(--orange-border); }
    .icon-cancelado_usuario i { color: #ff8c00; font-size: 16px; }
    .icon-cancelado_conductor { background: var(--red-dim); border: 1.5px solid var(--red-border); }
    .icon-cancelado_conductor i { color: var(--red); font-size: 16px; }
    .icon-nuevo { background: var(--gray-dim); border: 1.5px solid var(--gray-border); }
    .icon-nuevo i { color: rgba(255,255,255,0.35); font-size: 16px; }
    .viaje-info { flex: 1; min-width: 0; }
    .viaje-dinero { font-size: 15px; font-weight: 700; color: white; margin-bottom: 2px; }
    .viaje-dinero.dim { color: rgba(255,255,255,0.4); }
    .viaje-meta { font-size: 11px; color: var(--text-dim); }
    .viaje-right { text-align: right; flex-shrink: 0; }
    .estado-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 8px; margin-bottom: 4px; }
    .badge-completado { background: var(--green-dim); color: var(--green); border: 1px solid var(--green-border); }
    .badge-rechazado { background: var(--gray-dim); color: rgba(255,255,255,0.4); border: 1px solid var(--gray-border); }
    .badge-cancelado_usuario { background: var(--orange-dim); color: #ff8c00; border: 1px solid var(--orange-border); }
    .badge-cancelado_conductor { background: var(--red-dim); color: var(--red); border: 1px solid var(--red-border); }
    .badge-nuevo { background: var(--gray-dim); color: rgba(255,255,255,0.4); border: 1px solid var(--gray-border); }
    .viaje-hora { font-size: 10px; color: rgba(255,255,255,0.25); }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; text-align: center; gap: 12px; }
    .empty-icon { font-size: 48px; opacity: 0.2; }
    .empty-text { font-size: 16px; color: var(--text-dim); font-weight: 600; }
    .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 16px; height: 70px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* ======================================
       SHEET DETALLE
    ====================================== */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: flex-end; }
    .overlay.visible { display: flex; }
    .sheet { width: 100%; background: #161616; border-radius: 24px 24px 0 0; border-top: 1px solid rgba(255,255,255,0.1); padding-bottom: 40px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); max-height: 85vh; overflow-y: auto; }
    .overlay.visible .sheet { transform: translateY(0); }
    .sheet-handle { display: flex; justify-content: center; padding: 12px 0 4px; position: sticky; top: 0; background: #161616; z-index: 1; }
    .sheet-handle-bar { width: 36px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.2); }
    .sheet-inner { padding: 8px 20px 20px; }
    .sheet-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .sheet-header-left { display: flex; align-items: center; gap: 10px; }
    .sheet-tipo { font-size: 13px; font-weight: 700; color: var(--text-dim); background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; }
    .btn-close { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.08); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn-close i { font-size: 16px; color: var(--text-dim); }
    .sheet-money { font-size: 40px; font-weight: 800; letter-spacing: -2px; margin-bottom: 6px; }
    .sheet-money.green { color: var(--green); }
    .sheet-money.dim { color: rgba(255,255,255,0.4); }
    .sheet-estado { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 10px; margin-bottom: 20px; }
    .divider { height: 1px; background: var(--border); margin: 16px 0; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .detail-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
    .detail-label { font-size: 11px; color: var(--text-dim); font-weight: 600; margin-bottom: 4px; }
    .detail-val { font-size: 18px; font-weight: 800; color: var(--text); }
    .detail-val span { font-size: 12px; color: var(--text-dim); font-weight: 500; }
    .score-bar-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
    .score-bar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .score-bar-label { font-size: 11px; color: var(--text-dim); font-weight: 600; }
    .score-bar-val { font-size: 18px; font-weight: 800; color: var(--text); }
    .score-bar-bg { height: 8px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; margin-bottom: 8px; }
    .score-bar-fill { height: 100%; border-radius: 999px; transition: width 0.5s ease; }
    .score-estado { font-size: 12px; font-weight: 700; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,10,10,0.95); border-top: 1px solid var(--border); padding: 10px 0 24px; display: flex; justify-content: space-around; backdrop-filter: blur(20px); z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; padding: 4px 12px; }
    .nav-item i { font-size: 22px; color: var(--text-dim); }
    .nav-item span { font-size: 10px; color: var(--text-dim); font-weight: 600; }
    .nav-item.active i { color: var(--green); }
    .nav-item.active span { color: var(--green); }
  </style>
</head>
<body>

  <div class="header">
    <p class="header-sub" id="header-sub">Cargando...</p>
    <p class="header-title">Historial</p>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="cambiarTab('todos', this)">Todos</button>
    <button class="tab" onclick="cambiarTab('hoy', this)">Hoy</button>
    <button class="tab" onclick="cambiarTab('semana', this)">Semana</button>
    <button class="tab" onclick="cambiarTab('mes', this)">Mes</button>
  </div>

  <div class="content" id="content">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>

  <!-- SHEET DETALLE -->
  <div class="overlay" id="overlay" onclick="cerrarDetalle(event)">
    <div class="sheet" id="sheet">
      <div class="sheet-handle"><div class="sheet-handle-bar"></div></div>
      <div class="sheet-inner" id="sheet-inner"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a class="nav-item" href="/inicio"><i class="ti ti-home"></i><span>Inicio</span></a>
    <a class="nav-item" href="/operativo"><i class="ti ti-steering-wheel"></i><span>Operativo</span></a>
    <a class="nav-item" href="/stats"><i class="ti ti-chart-bar"></i><span>Stats</span></a>
    <a class="nav-item active" href="/historial"><i class="ti ti-calendar"></i><span>Historial</span></a>
    <a class="nav-item" href="/config"><i class="ti ti-settings"></i><span>Config</span></a>
  </nav>

  <script>
    const dias = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
    const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

    function fmt(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }

    function formatFecha(fechaStr) {
      const f = new Date(fechaStr.replace(" ", "T") + "-05:00");
      const hoy = new Date(); const ayer = new Date(); ayer.setDate(ayer.getDate() - 1);
      if (f.toDateString() === hoy.toDateString()) return "Hoy";
      if (f.toDateString() === ayer.toDateString()) return "Ayer";
      return `${dias[f.getDay()]} ${f.getDate()} ${meses[f.getMonth()]}`;
    }

    function formatHora(fechaStr) {
      const f = new Date(fechaStr.replace(" ", "T") + "-05:00");
      return f.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });
    }

    function iconoEstado(estado) {
      const map = {
        completado: { cls: "icon-completado", icon: "ti-check" },
        rechazado: { cls: "icon-rechazado", icon: "ti-ban" },
        cancelado_usuario: { cls: "icon-cancelado_usuario", icon: "ti-user-x" },
        cancelado_conductor: { cls: "icon-cancelado_conductor", icon: "ti-x" },
        nuevo: { cls: "icon-nuevo", icon: "ti-clock" },
      };
      return map[estado] || { cls: "icon-rechazado", icon: "ti-ban" };
    }

    function labelEstado(estado) {
      const map = {
        completado: "Completado", rechazado: "Rechazado",
        cancelado_usuario: "Canc. usuario", cancelado_conductor: "Canc. conductor", nuevo: "Sin acción",
      };
      return map[estado] || estado;
    }

    function labelEstadoFull(estado) {
      const map = {
        completado: "Completado", rechazado: "Rechazado",
        cancelado_usuario: "Cancelado por usuario", cancelado_conductor: "Cancelado por conductor", nuevo: "Sin acción",
      };
      return map[estado] || estado;
    }

    function scoreInfo(s) {
      if (s >= 9) return { label: "🔥 Excelente viaje", color: "#00ff73" };
      if (s >= 7) return { label: "✅ Buen viaje", color: "#00ff73" };
      if (s >= 5) return { label: "⚠️ Regular", color: "#ffb400" };
      return { label: "❌ Poco rentable", color: "#ff4444" };
    }

    function estadoColor(estado) {
      const map = {
        completado: { bg: "rgba(0,255,115,0.12)", color: "#00ff73", border: "rgba(0,255,115,0.25)" },
        rechazado: { bg: "rgba(150,150,150,0.1)", color: "rgba(255,255,255,0.4)", border: "rgba(150,150,150,0.2)" },
        cancelado_usuario: { bg: "rgba(255,140,0,0.08)", color: "#ff8c00", border: "rgba(255,140,0,0.25)" },
        cancelado_conductor: { bg: "rgba(255,60,60,0.12)", color: "#ff4444", border: "rgba(255,60,60,0.25)" },
        nuevo: { bg: "rgba(150,150,150,0.1)", color: "rgba(255,255,255,0.4)", border: "rgba(150,150,150,0.2)" },
      };
      return map[estado] || map.rechazado;
    }

    function filtrarViajes(viajes, tab) {
      const ahora = new Date();
      return viajes.filter(v => {
        const f = new Date(v.fecha.replace(" ", "T") + "-05:00");
        if (tab === "hoy") return f.toDateString() === ahora.toDateString();
        if (tab === "semana") { const s = new Date(); s.setDate(ahora.getDate() - 7); return f >= s; }
        if (tab === "mes") return f.getMonth() === ahora.getMonth() && f.getFullYear() === ahora.getFullYear();
        return true;
      });
    }

    let todosLosViajes = [];
    let tabActual = "todos";

    function abrirDetalle(v) {
      const esCompletado = v.estado === "completado";
      const dinero_por_min = v.tiempo_total > 0 ? v.dinero / v.tiempo_total : 0;
      const dinero_por_km = v.distancia_total > 0 ? v.dinero / v.distancia_total : 0;
      const dinero_por_hora = dinero_por_min * 60;
      const sc = scoreInfo(v.score_visual);
      const ec = estadoColor(v.estado);
      const moneyClass = esCompletado ? "green" : "dim";

      document.getElementById("sheet-inner").innerHTML = `
        <div class="sheet-header">
          <span class="sheet-tipo">${v.tipo_viaje || "Uber"}</span>
          <button class="btn-close" onclick="cerrarDetalle()"><i class="ti ti-x"></i></button>
        </div>
        <p class="sheet-money ${moneyClass}">$${fmt(v.dinero)}</p>
        <div class="sheet-estado" style="background:${ec.bg}; color:${ec.color}; border:1px solid ${ec.border};">
          ${labelEstadoFull(v.estado)}
        </div>

        <div class="divider"></div>

        <div class="detail-grid">
          <div class="detail-card">
            <p class="detail-label">Por hora</p>
            <p class="detail-val">${esCompletado ? `$${fmt(dinero_por_hora)}` : "—"}<span>/hr</span></p>
          </div>
          <div class="detail-card">
            <p class="detail-label">Por minuto</p>
            <p class="detail-val">${esCompletado ? `$${fmt(dinero_por_min)}` : "—"}<span>/min</span></p>
          </div>
          <div class="detail-card">
            <p class="detail-label">Por km</p>
            <p class="detail-val">${esCompletado ? `$${fmt(dinero_por_km)}` : "—"}<span>/km</span></p>
          </div>
          <div class="detail-card">
            <p class="detail-label">Distancia total</p>
            <p class="detail-val">${v.distancia_total}<span>km</span></p>
          </div>
          <div class="detail-card">
            <p class="detail-label">Tiempo total</p>
            <p class="detail-val">${v.tiempo_total}<span>min</span></p>
          </div>
          <div class="detail-card">
            <p class="detail-label">Fecha</p>
            <p class="detail-val" style="font-size:13px;">${formatHora(v.fecha)}</p>
          </div>
        </div>

        ${esCompletado ? `
        <div class="score-bar-wrap">
          <div class="score-bar-header">
            <span class="score-bar-label">Score del viaje</span>
            <span class="score-bar-val">${v.score_visual}<span style="font-size:13px; color:var(--text-dim); font-weight:500;">/10</span></span>
          </div>
          <div class="score-bar-bg">
            <div class="score-bar-fill" style="width:${v.score_visual * 10}%; background:${sc.color};"></div>
          </div>
          <p class="score-estado" style="color:${sc.color};">${sc.label}</p>
        </div>` : ""}
      `;

      document.getElementById("overlay").classList.add("visible");
    }

    function cerrarDetalle(e) {
      if (e && e.target !== document.getElementById("overlay")) return;
      document.getElementById("overlay").classList.remove("visible");
    }

    function renderViajes(viajes) {
      const content = document.getElementById("content");
      document.getElementById("header-sub").textContent = `${viajes.length} viaje${viajes.length !== 1 ? "s" : ""}`;

      if (viajes.length === 0) {
        content.innerHTML = `<div class="empty-state"><div class="empty-icon">🚖</div><p class="empty-text">Sin viajes en este período</p></div>`;
        return;
      }

      const grupos = {};
      viajes.forEach(v => {
        const key = formatFecha(v.fecha);
        if (!grupos[key]) grupos[key] = [];
        grupos[key].push(v);
      });

      let html = "";
      for (const [fecha, lista] of Object.entries(grupos)) {
        html += `<p class="fecha-label">${fecha}</p>`;
        lista.forEach((v, i) => {
          const { cls, icon } = iconoEstado(v.estado);
          const esCompletado = v.estado === "completado";
          const meta = esCompletado
            ? `${v.distancia_total}km · ${v.tiempo_total}min · $${fmt(v.dinero / v.distancia_total)}/km`
            : `${v.distancia_total}km · ${v.tiempo_total}min`;

          html += `
          <div class="viaje-item" onclick='abrirDetalle(${JSON.stringify(v)})'>
            <div class="viaje-left">
              <div class="viaje-icon ${cls}"><i class="ti ${icon}"></i></div>
              <div class="viaje-info">
                <p class="viaje-dinero ${esCompletado ? '' : 'dim'}">$${fmt(v.dinero)}</p>
                <p class="viaje-meta">${meta}</p>
              </div>
            </div>
            <div class="viaje-right">
              <div class="estado-badge badge-${v.estado}">${labelEstado(v.estado)}</div>
              <p class="viaje-hora">${formatHora(v.fecha)}</p>
            </div>
          </div>`;
        });
      }
      content.innerHTML = html;
    }

    async function cargarHistorial() {
      try {
        const res = await fetch("/api/historial");
        todosLosViajes = await res.json();
        renderViajes(filtrarViajes(todosLosViajes, tabActual));
      } catch(e) { console.error("Error:", e); }
    }

    function cambiarTab(tab, btn) {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      btn.classList.add("active");
      tabActual = tab;
      renderViajes(filtrarViajes(todosLosViajes, tab));
    }

    cargarHistorial();
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") cargarHistorial(); });
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
  </script>
</body>
</html>
