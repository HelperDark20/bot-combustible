<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Overlay IA Viajes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            background: transparent;

            font-family: 'Inter', sans-serif;

            padding: 12px;

            overflow: hidden;
        }

        .overlay {

            width: 100%;

            max-width: 390px;

            background: #050505;

            border-radius: 34px;

            border: 1px solid rgba(0,255,100,0.22);

            overflow: hidden;

            box-shadow:
                0 0 25px rgba(0,255,100,0.12),
                0 15px 45px rgba(0,0,0,0.65);

            animation: fadeIn 0.35s ease;
        }

        .content {

            padding: 12px;
        }

        .top-row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 22px;
        }

        .uber {

            font-size: 16px;

            font-weight: 700;

            color: white;
        }

        .earning {

            font-size: 22px;

            font-weight: 800;

            color: white;

            flex: 1;
        }

        .earning span {

            font-size: 30px;

            opacity: 0.55;

            font-weight: 500;
        }

        .price-box {

            min-width: 90px;

            height: 42px;

            border-radius: 14px;

            background: rgba(0,255,100,0.12);

            border: 2px solid rgba(0,255,100,0.75);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 20px;

            font-weight: 800;

            color: #00ff73;

            box-shadow:
                0 0 20px rgba(0,255,100,0.25);
        }

        .km-box {

            font-size: 18px;

            font-weight: 800;

            color: white;

            white-space: nowrap;
        }

        .km-box span {

            font-size: 30px;

            opacity: 0.55;

            font-weight: 500;
        }

        .middle {

            display: flex;

            align-items: center;

            margin-top: 14px;
        }

        .icon-circle {

            width: 42px;

            height: 42px;

            border-radius: 50%;

            border: 3px solid #00ff73;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 18px;

            color: #00ff73;

            box-shadow:
                0 0 20px rgba(0,255,100,0.35);
        }

        .route-line {

            flex: 1;

            height: 4px;

            background: #00ff73;

            margin: 0 22px;

            border-radius: 999px;

            position: relative;

            box-shadow:
                0 0 18px rgba(0,255,100,0.45);
        }

        .route-user {

            position: absolute;

            top: 50%;

            transform: translate(-50%, -50%);

            width: 34px;

            height: 34px;

            border-radius: 50%;

            background: #071107;

            border: 3px solid #00ff73;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 14px;

            color: #00ff73;

            box-shadow:
                0 0 18px rgba(0,255,100,0.35);
        }

        .right-info {

            width: 210px;

            display: flex;

            flex-direction: column;

            gap: 8px;

            align-items: flex-start;

            margin-right: 20px;
        }

        .time {

            font-size: 16px;

            font-weight: 800;

            color: white;
        }

        .distance {

            font-size: 14px;

            color: rgba(255,255,255,0.72);

            font-weight: 600;
        }

        .score {

            font-size: 14px;

            color: white;

            font-weight: 800;
        }

        .actions {

            display: flex;

            gap: 10px;

            padding: 0 12px 12px 12px;

            margin-top: 14px;
        }

        .btn {

            flex: 1;

            height: 42px;

            border-radius: 14px;

            border: none;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 14px;

            font-weight: 800;

            text-decoration: none;

            transition: 0.2s;

            cursor: pointer;
        }

        .btn:hover {

            transform: scale(1.02);
        }

        .accept {

            background: #00ff73;

            color: black;

            box-shadow:
                0 0 25px rgba(0,255,100,0.28);
        }

        .reject {

            background: rgba(255,0,0,0.16);

            color: #ff3a3a;

            border: 1px solid rgba(255,0,0,0.25);
        }

        @keyframes fadeIn {

            from {

                opacity: 0;

                transform: translateY(-20px);
            }

            to {

                opacity: 1;

                transform: translateY(0);
            }
        }

    </style>

</head>

<body>

    <div class="overlay">

        <div class="content">

            <div class="top-row">

                <div class="uber">
                    Uber
                </div>

                <div class="earning">
                    {{ viaje.dinero_por_hora_texto }}<span>/hr</span>
                </div>

                <div class="price-box">
                    {{ viaje.ganancia }}
                </div>

                <div class="km-box">
                    {{ viaje.dinero_por_km_texto }}<span>/km</span>
                </div>

            </div>

            <div class="middle">

                <div class="icon-circle">
                    🚗
                </div>

                <div class="route-line">

                    <div
                        class="route-user"
                        style="left: {{ viaje['porcentaje_usuario'] }}%;"
                    >
                        {{ viaje.cantidad_paradas or 1 }}
                    </div>

                </div>

                <div class="right-info">

                    <div class="time">
                        {{ viaje.tiempo_total }}min
                    </div>

                    <div class="distance">
                        {{ viaje.distancia_total }}km
                    </div>

                    <div class="score">
                        ⭐ {{ viaje.score_visual }}/10
                    </div>

                </div>

                <div class="icon-circle">
                    📍
                </div>

            </div>

        </div>

        <div class="actions">

            <a href="/web/finalizar" class="btn accept">
                ✓ ACEPTAR
            </a>

            <a href="/web/cancelar" class="btn reject">
                ✕ RECHAZAR
            </a>

        </div>

    </div>

</body>

</html>
