<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Overlay IA Viajes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      font-family: 'Space Grotesk', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* Empuja el overlay al top, pegado al notch */
      padding-top: env(safe-area-inset-top, 0px);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .iphone-notch {
      width: 126px;
      height: 34px;
      background: #000;
      border-radius: 0 0 20px 20px;
      margin-bottom: -2px;
      z-index: 10;
      position: relative;
    }

    .di-pill {
      width: calc(100vw - 24px);
      max-width: 390px; /* ancho exacto iPhone 16 Pro Max */
      background: #0d0d0d;
      border-radius: 26px;
      border: 1px solid rgba(0,255,100,0.28);
      box-shadow:
        0 0 0 1px rgba(0,255,100,0.08),
        0 0 30px rgba(0,255,100,0.18),
        0 8px 32px rgba(0,0,0,0.8);
      overflow: hidden;
      z-index: 5;
      animation: expandIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    @keyframes expandIn {
      from { transform: scaleX(0.35) scaleY(0.55); opacity: 0; }
      to   { transform: scaleX(1) scaleY(1); opacity: 1; }
    }

    .di-inner { padding: 14px 18px 0 18px; }

    /* ── Fila superior ── */
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .top-item {
      display: flex;
      align-items: center;
      white-space: nowrap;
    }

    .brand {
      font-size: 12px;
      font-weight: 700;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-right: 5px;
    }

    .stat-value {
      font-size: 15px;
      font-weight: 800;
      color: white;
      white-space: nowrap;
    }

    .stat-value em {
      font-style: normal;
      font-size: 11px;
      font-weight: 500;
      color: rgba(255,255,255,0.4);
    }

    .price-pill {
      background: rgba(0,255,100,0.1);
      border: 1.5px solid rgba(0,255,100,0.7);
      border-radius: 10px;
      padding: 3px 10px;
      font-size: 14px;
      font-weight: 800;
      color: #00ff73;
      box-shadow: 0 0 10px rgba(0,255,100,0.2);
      white-space: nowrap;
    }

    /* ── Fila ruta ── */
    .route-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .icon-ring {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid #00ff73;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 10px rgba(0,255,100,0.3);
      color: #00ff73;
    }

    .track-wrap {
      flex: 1;
      position: relative;
      height: 6px;
    }

    .track {
      width: 100%;
      height: 6px;
      background: #00ff73;
      border-radius: 999px;
      box-shadow: 0 0 10px rgba(0,255,100,0.4);
    }

    .stop-bubble {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #0d0d0d;
      border: 2px solid #00ff73;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: #00ff73;
      box-shadow: 0 0 8px rgba(0,255,100,0.35);
    }

    .stats-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
      min-width: 52px;
    }

    .stat-time  { font-size: 11px; font-weight: 700; color: white; }
    .stat-dist  { font-size: 10px; color: rgba(255,255,255,0.45); font-weight: 600; }
    .stat-score { font-size: 10px; color: rgba(255,255,255,0.7); font-weight: 600; }

    /* ── Botones ── */
    .divider {
      height: 1px;
      background: rgba(0,255,100,0.08);
      margin: 0 0 10px 0;
    }

    .actions {
      display: flex;
      gap: 8px;
      padding: 0 10px 12px 10px;
      margin-top: 4px;
    }

    .btn {
      flex: 1;
      height: 48px;
      border-radius: 16px;
      border: none;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.15s, opacity 0.15s;
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active { transform: scale(0.97); opacity: 0.85; }

    .btn-accept {
      background: #00ff73;
      color: #000;
      box-shadow: 0 0 18px rgba(0,255,100,0.3);
    }

    .btn-reject {
      background: rgba(220,30,30,0.18);
      color: #ff4444;
      border: 1px solid rgba(255,60,60,0.3);
    }
  </style>
</head>
<body>

  <div class="iphone-notch"></div>

  <div class="di-pill">
    <div class="di-inner">

      <!-- Fila superior: Uber | /hr — ganancia — /km -->
      <div class="top-row">
        <div class="top-item">
          <span class="brand">Uber</span>
          <span class="stat-value">{{ viaje.dinero_por_hora_texto }}<em>/hr</em></span>
        </div>
        <div class="price-pill">{{ viaje.ganancia }}</div>
        <div class="top-item">
          <span class="stat-value">{{ viaje.dinero_por_km_texto }}<em>/km</em></span>
        </div>
      </div>

      <!-- Fila ruta: carro — barra — stats — pin -->
      <div class="route-row">
        <div class="icon-ring">
          <i class="ti ti-car" aria-hidden="true" style="font-size:17px;"></i>
        </div>

        <div class="track-wrap">
          <div class="track"></div>
          <div class="stop-bubble" style="left: {{ viaje['porcentaje_usuario'] }}%;">
            {{ viaje.cantidad_paradas or 1 }}
          </div>
        </div>

        <div class="stats-col">
          <span class="stat-time">{{ viaje.tiempo_total }}min</span>
          <span class="stat-dist">{{ viaje.distancia_total }}km</span>
          <span class="stat-score">★ {{ viaje.score_visual }}/10</span>
        </div>

        <div class="icon-ring">
          <i class="ti ti-map-pin" aria-hidden="true" style="font-size:16px;"></i>
        </div>
      </div>

    </div>

    <div class="divider"></div>

    <div class="actions">
      <a href="/web/finalizar" class="btn btn-accept">
        <i class="ti ti-check" style="font-size:16px;" aria-hidden="true"></i>
        Aceptar
      </a>
      <a href="/web/cancelar" class="btn btn-reject">
        <i class="ti ti-x" style="font-size:16px;" aria-hidden="true"></i>
        Rechazar
      </a>
    </div>
  </div>

</body>
</html>
