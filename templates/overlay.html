<!DOCTYPE html>
<html>

<head>

    <title>Overlay Viaje</title>

    <style>

        body {

            background: transparent;

            font-family: Arial;

            color: white;

            margin: 0;

            padding: 20px;
        }

        .card {

            width: 350px;

            animation: fadeIn 0.5s ease;

            background: rgba(20,20,20,0.92);

            border-radius: 20px;

            padding: 20px;

            box-shadow: 0 0 25px rgba(0,0,0,0.5);
        }

        .money {

            font-size: 42px;

            font-weight: bold;

            color: #00ff99;
        }

        .score {

            font-size: 24px;

            margin-top: 10px;
        }

        .stats {

            margin-top: 15px;

            font-size: 18px;

            opacity: 0.9;
        }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    </style>

</head>

<body>

    <div class="card">

        <div class="money">
            ${{ viaje.ganancia }}
        </div>

        <div class="score">
            {{ viaje.score_visual }}
            {{ viaje.estado_score }}
        </div>

        <div class="stats">

            🚗 {{ viaje.distancia_total }} km

            <br><br>

            ⏱️ {{ viaje.tiempo_total }} min

            <br><br>

            💸 {{ viaje.dinero_por_km }}/km

        </div>

    </div>

<script> setInterval(() => { location.reload() }, 3000) </script>

</body>

</html>
