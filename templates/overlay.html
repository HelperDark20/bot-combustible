<!DOCTYPE html>
                <div class="label">⏱ TIEMPO</div>
                <div class="value">
                    {{ viaje.tiempo_total }} min
                </div>
            </div>

        </div>

        <div class="middle-grid">

            <div class="stat">
                <div class="label">💵 COP/KM</div>
                <div class="value">
                    {{ viaje.dinero_por_km }}
                </div>
            </div>

            <div class="stat">
                <div class="label">💸 COP/MIN</div>
                <div class="value">
                    {{ viaje.dinero_por_min }}
                </div>
            </div>

            <div class="stat">
                <div class="label">⭐ SCORE</div>
                <div class="value">
                    {{ viaje.score_visual }}/10
                </div>
            </div>

        </div>

        <div class="bottom">

            <div class="score-row">

                <div class="estado">
                    {{ viaje.estado_score }}
                </div>

                <div class="live">
                    ● EN TIEMPO REAL
                </div>

            </div>

            <div class="route-wrapper">

                <div class="route-line">

                    <div class="route-progress"></div>

                </div>

                <div class="route-points">

                    <div>🚗 Conductor</div>

                    <div>🧍 Usuario</div>

                    <div>📍 Destino</div>

                </div>

            </div>

        </div>

    </div>

    <script>

        setInterval(() => {

            location.reload()

        }, 3000)

    </script>

</body>

</html>
